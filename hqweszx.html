<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>False Gate</title>

<style>
body{
    background:black;
    color:#00ffcc;
    font-family:monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    overflow:hidden;
}

.box{
    border:1px solid #00ffcc;
    padding:30px;
    width:80%;
    max-width:600px;
    border-radius:10px;
    box-shadow:0 0 20px #00ffcc33;
}

h1{
    color:red;
    animation:blink 0.5s infinite;
}

@keyframes blink{
    50%{
        opacity:0.4;
    }
}

p{
    margin-top:20px;
    line-height:1.7;
}
</style>
</head>
<body>

<div class="box">

<h1>⚠ FALSE URL ⚠</h1>

<p>
Kamu memasuki URL yang salah.
</p>

<p>
Fragmen ini hanyalah pantulan palsu.
</p>

<p>
Coba lagi, kawan.
</p>

</div>

</body>
</html>
